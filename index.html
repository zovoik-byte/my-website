<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tina - my corner of the internet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>hi, i'm Tina</h1>
      <p class="tagline">i build small weird websites</p>
    </header>

    <main>
      <section class="card">
        <h2>About me</h2>
        <p>
          I built this page <strong>from an empty folder</strong>. It has my
          name on it and <em>three</em> things I like.
        </p>
      </section>
       
      <section class="card">
        <h2>Things I like</h2>
        <ul>
          <li>iced drinks</li>
          <li>fonts with little feet</li>
          <li>finishing things</li>
        </ul>
      </section>
       
      <section class="card">
        <h2>Find me</h2>
        <p><a href="https://github.com">my github</a></p>
        <button id="cheer">cheer me on</button>
        <p id="count">0 cheers</p>
      </section>
    </main>

    <footer>
      <p>made by Tina</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
